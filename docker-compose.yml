version: "3.9"

services:
  registry:
    image: balance-registry:latest
    container_name: balanceron-registry
    ports:
      - "8080:8080"

  echo-unit-1:
    image: echo-unit:latest
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      - INSTANCE_ID=echo-unit-1

  echo-unit-2:
    image: echo-unit:latest
    ports:
      - "8082:8081"
    environment:
      - SERVER_PORT=8082
      - INSTANCE_ID=echo-unit-2

  echo-unit-3:
    image: echo-unit:latest
    ports:
      - "8083:8081"
    environment:
      - SERVER_PORT=8083
      - INSTANCE_ID=echo-unit-3
