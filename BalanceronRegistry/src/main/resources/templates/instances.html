<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registered Instances</title>
    <style>
        body {
            font-family: sans-serif;
        }
        table {
            width: 60%;
            border-collapse: collapse;
            margin: 20px auto;
        }
        th, td {
            border: 1px solid #aaa;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #ddd;
        }
        .controls {
            text-align: center;
            margin-top: 20px;
        }
        button {
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<h2 style="text-align: center;">Registered Instances</h2>

<div class="controls">
    <form method="get" action="/ui/instances">
        <button type="submit">🔄 Обновить</button>
    </form>
</div>

<table>
    <thead>
    <tr>
        <th>Instance ID</th>
        <th>Address</th>
        <th>Port</th>
        <th>Last Heartbeat</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="instance : ${instances}">
        <td th:text="${instance.getInstanceId()}">ID</td>
        <td th:text="${instance.getAddress()}">Address</td>
        <td th:text="${instance.getPort()}">Port</td>
        <td th:text="${instance.getLastHeartBeat()}">Last HB</td>
    </tr>
    </tbody>
</table>
</body>
</html>
